<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MegaCel, tienda de celulares con los mejores precios y modelos del mercado.">
    <meta name="keywords" content="celulares, smartphones, tienda, MegaCel, telefonos, accesorios">
    <meta name="author" content="MegaCel">
    <title>MegaCel - Tienda de Celulares</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <div class="contenedor-header">
            <h1 class="logo">Mega<span class="logo-acento">Cel</span></h1>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacto" id="contacto">
            <h2>Escríbenos</h2>
            <p>¿Tienes dudas sobre algún equipo? Completa el formulario y te contactamos a la brevedad.</p>

            <form class="formulario-contacto" action="#" method="post">

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+51 900 000 000">

                <label for="modelo">Modelo de interés</label>
                <select id="modelo" name="modelo">
                    <option value="11">iPhone 11 </option>
                    <option value="13">iPhone 13</option>
                    <option value="14">iPhone 14</option>
                    <option value="15">iPhone 15 </option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Cuéntanos qué necesitas..."></textarea>

                <button type="submit" class="boton">Enviar mensaje</button>
            </form>
        </section>









    </main>

    <footer>
        <p>Av. Progreso 178 ATE, Lima - Perú</p>
        <p>Escríbenos: <a href="mailto:contacto@megacel.com">contacto@megacel.com</a></p>
        <p>&copy; 2026 MegaCel. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
